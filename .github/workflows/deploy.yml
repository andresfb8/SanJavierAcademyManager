name: Build and Deploy to Firebase

on:
  push:
    branches:
      - master
      - main

jobs:
  build-and-deploy:
    name: Build and Deploy
    runs-on: ubuntu-latest

    steps:
      # 1. Checkout del repositorio
      - name: Checkout repository
        uses: actions/checkout@v4

      # 2. Configurar Node.js 20 (versión requerida por Cloud Functions)
      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      # 3. Instalar dependencias del frontend
      - name: Install frontend dependencies
        run: npm ci

      # 4. Build del frontend
      - name: Build frontend
        run: npm run build

      # 5. Instalar dependencias de Cloud Functions
      - name: Install functions dependencies
        run: npm --prefix functions ci

      # 6. Instalar Firebase CLI
      - name: Install Firebase CLI
        run: npm install -g firebase-tools

      # 7. Verificar credenciales y desplegar
      - name: Deploy to Firebase
        env:
          SA_JSON: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          GOOGLE_APPLICATION_CREDENTIALS: /tmp/sa-key.json
        run: |
          # Escribir service account a archivo usando printf (robusto con JSON)
          printf '%s' "$SA_JSON" > /tmp/sa-key.json
          # Verificar que el JSON es válido
          python3 -c "import json; d=json.load(open('/tmp/sa-key.json')); print('SA key OK, project:', d.get('project_id','?'), 'email:', d.get('client_email','?'))"
          # Deploy solo hosting primero para verificar auth
          firebase deploy --only hosting --non-interactive --project san-javieracademy-manager
          # Deploy functions y firestore
          firebase deploy --only functions,firestore --non-interactive --project san-javieracademy-manager
