name: Build and Deploy to Firebase

on:
  push:
    branches:
      - master
      - main

jobs:
  build-and-deploy:
    name: Build and Deploy
    runs-on: ubuntu-latest

    steps:
      # 1. Checkout del repositorio
      - name: Checkout repository
        uses: actions/checkout@v4

      # 2. Configurar Node.js 22 (versión requerida por Cloud Functions)
      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      # 3. Instalar dependencias del frontend
      - name: Install frontend dependencies
        run: npm ci

      # 4. Build del frontend
      - name: Build frontend
        run: npm run build

      # 5. Instalar dependencias de Cloud Functions
      - name: Install functions dependencies
        run: npm --prefix functions install

      # 6. Instalar Firebase CLI
      - name: Install Firebase CLI
        run: npm install -g firebase-tools

      # 7. Verificar credenciales
      - name: Validate service account secret
        env:
          SA_JSON: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
        run: |
          if [ -z "$SA_JSON" ]; then
            echo "ERROR: FIREBASE_SERVICE_ACCOUNT secret is empty or not set"
            exit 1
          fi
          printf '%s' "$SA_JSON" > /tmp/sa-key.json
          python3 -c "
          import json, sys
          try:
              d = json.load(open('/tmp/sa-key.json'))
              print('SA key OK - project:', d.get('project_id','?'), '| email:', d.get('client_email','?'))
          except Exception as e:
              print('ERROR parsing JSON:', e)
              sys.exit(1)
          "

      # 8. Deploy hosting
      - name: Deploy hosting to Firebase
        env:
          SA_JSON: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          GOOGLE_APPLICATION_CREDENTIALS: /tmp/sa-key.json
        run: |
          printf '%s' "$SA_JSON" > /tmp/sa-key.json
          firebase deploy --only hosting --non-interactive --project san-javieracademy-manager

      # 9. Deploy functions y firestore (requiere plan Blaze en Firebase)
      - name: Deploy functions and Firestore to Firebase
        env:
          SA_JSON: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          GOOGLE_APPLICATION_CREDENTIALS: /tmp/sa-key.json
        run: |
          printf '%s' "$SA_JSON" > /tmp/sa-key.json
          if ! firebase deploy --only functions,firestore --non-interactive --project san-javieracademy-manager 2>&1; then
            echo ""
            echo "============================================================"
            echo "AVISO: El deploy de Cloud Functions falló."
            echo "Cloud Functions requiere el plan Blaze (pago por uso) en Firebase."
            echo "Para activarlo: https://console.firebase.google.com/project/san-javieracademy-manager/usage/details"
            echo "El hosting se desplegó correctamente."
            echo "============================================================"
            exit 1
          fi
