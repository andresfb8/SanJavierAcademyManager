name: Build and Deploy to Firebase

on:
  push:
    branches:
      - master
      - main

jobs:
  build-and-deploy:
    name: Build and Deploy
    runs-on: ubuntu-latest

    steps:
      # 1. Checkout del repositorio
      - name: Checkout repository
        uses: actions/checkout@v4

      # 2. Configurar Node.js 20 (versión requerida por Cloud Functions)
      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      # 3. Instalar dependencias del frontend
      - name: Install frontend dependencies
        run: npm ci

      # 4. Build del frontend
      - name: Build frontend
        run: npm run build

      # 5. Instalar dependencias de Cloud Functions
      - name: Install functions dependencies
        run: npm --prefix functions ci

      # 6. Instalar Firebase CLI
      - name: Install Firebase CLI
        run: npm install -g firebase-tools

      # 7. Verificar que el secret existe y es JSON válido
      - name: Validate service account secret
        env:
          SA_JSON: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
        run: |
          echo "SA_JSON length: ${#SA_JSON}"
          if [ -z "$SA_JSON" ]; then
            echo "ERROR: FIREBASE_SERVICE_ACCOUNT secret is empty or not set"
            exit 1
          fi
          printf '%s' "$SA_JSON" > /tmp/sa-key.json
          python3 -c "
          import json, sys
          try:
              d = json.load(open('/tmp/sa-key.json'))
              print('SA key OK')
              print('  project_id:', d.get('project_id', 'NOT FOUND'))
              print('  client_email:', d.get('client_email', 'NOT FOUND'))
              print('  type:', d.get('type', 'NOT FOUND'))
          except Exception as e:
              print('ERROR parsing JSON:', e)
              sys.exit(1)
          "

      # 8. Deploy hosting a Firebase
      - name: Deploy hosting to Firebase
        env:
          SA_JSON: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          GOOGLE_APPLICATION_CREDENTIALS: /tmp/sa-key.json
        run: |
          printf '%s' "$SA_JSON" > /tmp/sa-key.json
          firebase deploy --only hosting --non-interactive --project san-javieracademy-manager

      # 9. Deploy functions y firestore
      - name: Deploy functions and Firestore to Firebase
        env:
          SA_JSON: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          GOOGLE_APPLICATION_CREDENTIALS: /tmp/sa-key.json
        run: |
          printf '%s' "$SA_JSON" > /tmp/sa-key.json
          firebase deploy --only functions,firestore --non-interactive --project san-javieracademy-manager
